<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#051f22"/>
      <stop offset="0.55" stop-color="#0d503d"/>
      <stop offset="1" stop-color="#173a29"/>
    </linearGradient>
    <radialGradient id="spot" cx="70%" cy="30%" r="70%">
      <stop offset="0" stop-color="#baf7cf" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#061d19" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1920" height="1080" fill="url(#bg)"/>
  <rect width="1920" height="1080" fill="url(#spot)"/>

  <!-- translucent plant/coral rings -->
  <g opacity="0.45">
    <ellipse cx="260" cy="880" rx="180" ry="38" fill="#9bc79a"/>
    <ellipse cx="1750" cy="760" rx="150" ry="50" fill="#9bc79a"/>
    <ellipse cx="1470" cy="180" rx="250" ry="40" fill="#9bc79a"/>
  </g>

  <!-- fish representation -->
  <g transform="translate(960 530)">
    <ellipse cx="0" cy="0" rx="380" ry="160" fill="#ff8a22" opacity="0.97"/>

    <!-- fish body white belly area -->
    <path d="M-250 20 C-180 -120, -60 -120, 30 -15 C80 25, 120 40, 230 40 C180 120, 70 130, -40 110 C-115 95, -180 80, -250 20 Z" fill="#fffefb" opacity="0.95"/>

    <!-- orange stripes / fins -->
    <path d="M-330 -10 C-240 -80, -170 -90, -110 -60 C-155 -35, -95 20, -70 50 C-125 40, -180 30, -230 15 Z" fill="#f46616"/>
    <path d="M-70 80 C-80 160, -30 165, 30 120 C10 90, -20 76, -70 80 Z" fill="#ff7d00"/>

    <!-- stripes and tail -->
    <path d="M-250 -25 C-170 -90, -120 -70, -110 -30 C-160 -45, -210 -25, -250 -25 Z" fill="#ff8a22"/>
    <path d="M240 -4 C320 -60, 370 -20, 330 30 C282 10, 260 0, 240 -4 Z" fill="#ff8a22"/>

    <!-- black eyes and mouth -->
    <ellipse cx="-30" cy="-90" rx="20" ry="24" fill="#070707"/>
    <circle cx="-20" cy="-95" r="7" fill="#fff"/>
    <path d="M280 80 C320 80, 330 95, 320 115 C310 110, 290 105, 280 80 Z" fill="#101010"/>

    <!-- decorative dots to resemble clownfish stripes -->
    <ellipse cx="-120" cy="-20" rx="30" ry="130" fill="#141414" opacity="0.85"/>
    <ellipse cx="120" cy="-15" rx="20" ry="80" fill="#101010" opacity="0.9"/>
  </g>

  <g opacity="0.8">
    <circle cx="160" cy="180" r="3" fill="#c9f8d6"/>
    <circle cx="1360" cy="130" r="3" fill="#c9f8d6"/>
    <circle cx="1400" cy="900" r="2" fill="#c9f8d6"/>
    <circle cx="420" cy="420" r="2" fill="#c9f8d6"/>
    <circle cx="1810" cy="420" r="2" fill="#c9f8d6"/>
  </g>
</svg>
